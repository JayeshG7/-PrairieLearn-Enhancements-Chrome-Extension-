<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calender Icon</title>
<style>

    #calender-icon  {
        width: 50px;
        height: 50px;
        background-color: #3482db;
        border-radius: 20%;
        cursor: pointer;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;

    }

    #line {
        width: 50px;
        height: 3px;
        background-color: white;
        margin-bottom: 25px;

    }

    #date-display {
        position: absolute;
        top: 12px;
        left: 18px;
        font-size: 30px;
    }
</style>
</head>
<body>
    <div id = "calender-icon" onclick="openCalender()">
        <div id ="line"></div>
        <div id="date-display"></div>
    </div>

    <script>
        function openCalender(){
            var calURL = 'https://workspace.google.com/products/calendar/?hl=en';

            window.open(calURL, '_blank');
        }

        function displayCurrDate(){
            var curr = new Date().getDate();
            document.getElementById('date-display').innerText = curr;
        }

        displayCurrDate();
    </script>
</body>
</html>
