<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Icon</title>
    <style>
        #calendar-icon {
            width: 50px;
            height: 50px;
            background-color: #3482db;
            border-radius: 20%;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;

        }

        #line {
            width: 50px;
            height: 3px;
            background-color: white;
            margin-bottom: 25px;

        }

        #date-display {
            position: absolute;
            top: 12px;
            left: 12px;
            font-size: 30px;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0 8px 16px 0 rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .dropdown-content a {
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            color: #000;
        }

        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }

        .dropdown-content a[href="https://calendar.google.com/calendar/u/0/r/settings/createcalendar"] {
            color: #3482db;
        }

        .dropdown-content a[href="https://calendar.google.com/calendar/u/0/r/eventedit?state=%5Bnull%2Cnull%2Cnull%2Cnull%2C%5B13%5D%5D"] {
            color: #3482db;
        }
    </style>
</head>

<body>
    <!--<div id="calendar-icon" onclick="openCalendar()">
        <div id="line"></div>
        <div id="date-display"></div>
    </div>-->

    <div class="dropdown">
        <div id="calendar-icon" onclick="openCalendar()">
            <div id="line"></div>
            <div id="date-display"></div>
        </div>
        <div class="dropdown-content">
            <a href="https://calendar.google.com/calendar/u/0/r/settings/createcalendar" target="_blank">View
                Calendar</a>
            <a href="https://calendar.google.com/calendar/u/0/r/eventedit?state=%5Bnull%2Cnull%2Cnull%2Cnull%2C%5B13%5D%5D"
                target="_blank">Add
                Event</a>
        </div>
    </div>

    <script>


        function displayCurrDate() {
            var curr = new Date().getDate();
            document.getElementById('date-display').innerText = curr;
        }

        displayCurrDate();
    </script>
</body>

</html>
